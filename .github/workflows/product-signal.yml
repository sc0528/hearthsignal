name: Refresh Product Signal

on:
  schedule:
    # Run at both UTC offsets, then select the one matching New York's current offset.
    # Separate expressions let the gate identify the intended trigger even if GitHub
    # starts the job late.
    - cron: "15 13 * * *"
    - cron: "15 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hearthsignal-product-signal
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.gate.outputs.should-run }}
    steps:
      - name: Check daily schedule
        id: gate
        shell: bash
        run: |
          should_run=true
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            offset="$(TZ=America/New_York date +%z)"
            expected_schedule="15 13 * * *"
            [[ "$offset" == "-0500" ]] && expected_schedule="15 14 * * *"
            if [[ "${{ github.event.schedule }}" != "$expected_schedule" ]]; then
              should_run=false
              echo "Skipping inactive daylight-saving-time trigger."
            fi
          fi
          echo "should-run=$should_run" >> "$GITHUB_OUTPUT"
      - name: Check out repository
        if: steps.gate.outputs.should-run == 'true'
        uses: actions/checkout@v7
      - name: Capture repository interest
        if: steps.gate.outputs.should-run == 'true'
        env:
          GH_TOKEN: ${{ secrets.ANALYTICS_TOKEN || github.token }}
        run: python scripts/capture_product_signal.py
      - name: Validate dashboard data
        if: steps.gate.outputs.should-run == 'true'
        run: |
          python -m json.tool analytics-data/snapshots.json > /dev/null
          python -m unittest tests.test_capture_product_signal
      - name: Commit daily snapshot
        if: steps.gate.outputs.should-run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics-data/snapshots.json
          git diff --cached --quiet || git commit -m "chore: capture daily product signal"
          git push
      - name: Configure Pages
        if: steps.gate.outputs.should-run == 'true'
        uses: actions/configure-pages@v6
      - name: Upload static site
        if: steps.gate.outputs.should-run == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    if: needs.refresh.outputs.should-run == 'true'
    needs: refresh
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}analytics-dashboard/
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
