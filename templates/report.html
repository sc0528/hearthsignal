<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{PAGE_TITLE}}</title>
  <style>
    :root{--ink:#0b1d33;--muted:#60708d;--line:#dbe2ec;--blue:#2563eb;--brand:#ff6b57;--ok:#2e7d48;--warn:#d98408;--bad:#d9473f;--soft:#f5f7fa;--white:#fff}*{box-sizing:border-box}
    body{margin:0;background:#edf1f5;color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.report{width:min(1320px,calc(100% - 32px));margin:28px auto;background:var(--white);box-shadow:0 18px 55px rgba(24,43,77,.1);padding:38px 42px}
    h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2rem,4vw,3.15rem);letter-spacing:-.05em;line-height:1;margin:0}.brand-lockup{display:flex;align-items:center;gap:16px}.brand-mark{width:58px;height:58px;flex:none}.tagline{color:var(--muted);margin:6px 0 8px;font-weight:600}.tagline em{color:var(--brand);font-style:normal}h2{font-size:1.12rem;letter-spacing:-.015em}h3{font-size:1.06rem;margin-bottom:8px}.muted{color:var(--muted)}
    header{display:flex;justify-content:space-between;gap:24px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:22px}.actions{display:flex;gap:10px}.button{border:1px solid #b9c5d6;background:white;color:var(--ink);padding:10px 15px;border-radius:8px;font:inherit;font-weight:650;cursor:pointer}.button.primary{border-color:#8db5f2;color:var(--blue)}
    .hero{display:grid;grid-template-columns:1.2fr .9fr;gap:34px;padding:30px 0;border-bottom:1px solid var(--line)}.overview{display:grid;grid-template-columns:210px 1fr;gap:26px;align-items:center}.score{--score:82;width:190px;aspect-ratio:1;border-radius:50%;display:grid;place-content:center;text-align:center;background:conic-gradient(var(--ok) calc(var(--score)*1%),#e5e9ee 0);position:relative}.score:before{content:"";position:absolute;inset:12px;border-radius:50%;background:white}.score>*{position:relative}.score strong{font-size:4.2rem;letter-spacing:-.07em;line-height:.9}.score span{font-weight:700;color:var(--muted)}.headline{font-size:1.45rem;font-weight:750;color:var(--bad);margin-bottom:10px}.statline{display:flex;gap:26px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.stat strong{font-size:1.4rem;display:block}.stat.ok strong{color:var(--ok)}.stat.warning strong{color:var(--warn)}.stat.critical strong{color:var(--bad)}
    .incidents{border-left:1px solid var(--line);padding-left:28px}.incident{position:relative;padding:0 0 22px 22px;margin:0 0 22px;border-left:6px solid var(--warn);border-bottom:1px solid var(--line)}.incident:last-child{margin-bottom:0}.incident.critical{border-left-color:var(--bad)}.incident-head{display:flex;justify-content:space-between;gap:12px}.severity{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;font-weight:800;color:var(--warn)}.critical .severity{color:var(--bad)}.why,.next{margin:12px 0 0}.why strong,.next strong{display:block}.next{padding-top:12px;border-top:1px solid var(--line)}
    .section{padding:26px 0;border-bottom:1px solid var(--line)}.trend svg{width:100%;height:150px;overflow:visible}.trend-grid{stroke:#e2e7ee;stroke-dasharray:3}.trend-line{fill:none;stroke:var(--blue);stroke-width:3}.trend-dot{fill:var(--blue)}.trend-label{fill:var(--muted);font-size:12px}.lower{display:grid;grid-template-columns:.8fr 1.2fr;gap:36px}.timeline{border-right:1px solid var(--line);padding-right:32px}.timeline-item{display:grid;grid-template-columns:82px 14px 1fr;gap:10px;margin:15px 0}.timeline-item i{width:10px;height:10px;border:2px solid var(--blue);border-radius:50%;margin-top:5px;position:relative}.timeline-item i:after{content:"";position:absolute;width:2px;height:34px;background:#bcd1ef;left:2px;top:8px}.timeline-item:last-child i:after{display:none}.timeline-item time{color:var(--muted);font-size:.85rem}.timeline-item p{margin:0}.category-row{display:grid;grid-template-columns:1.2fr .75fr .75fr;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:center}.category-row:last-child{border:0}.status-ok{color:var(--ok);font-weight:750}.status-warning{color:var(--warn);font-weight:750}.status-critical{color:var(--bad);font-weight:750}
    .healthy-list{display:flex;gap:10px 26px;flex-wrap:wrap}.healthy-item{white-space:nowrap}.healthy-item:before{content:"✓";display:inline-grid;place-content:center;width:22px;height:22px;border:2px solid var(--ok);color:var(--ok);border-radius:50%;font-weight:900;margin-right:8px}footer{text-align:center;color:var(--muted);padding-top:24px;font-size:.88rem}
    .forecast-band{background:#f7f9fc;margin:0 -42px;padding:22px 42px}.forecast-list{display:flex;gap:18px;flex-wrap:wrap}.forecast-item{display:grid;gap:3px;border-left:4px solid var(--blue);padding:5px 18px;min-width:280px;flex:1}.forecast-item span{color:var(--muted)}
    @media(max-width:900px){.report{padding:26px}.hero,.lower{grid-template-columns:1fr}.incidents,.timeline{border-left:0;border-right:0;padding-left:0;padding-right:0}.overview{grid-template-columns:160px 1fr}.score{width:150px}.score strong{font-size:3rem}.forecast-band{margin:0 -26px;padding:22px 26px}}
    @media(max-width:600px){body{background:white}.report{width:100%;margin:0;box-shadow:none;padding:20px}header{display:block}.actions{margin-top:18px}.hero{padding-top:22px}.overview{grid-template-columns:1fr}.score{margin:auto}.statline{gap:14px;justify-content:space-between}.category-row{grid-template-columns:1fr auto}.category-row span:nth-child(2){display:none}.incident-head{display:block}.lower{gap:0}}
    @media print{body{background:white}.report{box-shadow:none;margin:0;width:100%;padding:16px}.actions{display:none}}
  </style>
</head>
<body><main class="report">
  {{HEADER}}
  <section class="hero"><div>{{OVERVIEW}}{{TREND}}</div><aside class="incidents"><h2>Prioritized incidents</h2>{{INCIDENTS}}</aside></section>
  <section class="forecast-band"><h2>Looking ahead</h2><div class="forecast-list">{{FORECASTS}}</div></section>
  <section class="section lower"><div class="timeline"><h2>What changed</h2>{{CHANGES}}</div><div><h2>Infrastructure overview</h2>{{CATEGORIES}}</div></section>
  <section class="section"><h2>Healthy systems</h2><div class="healthy-list">{{HEALTHY}}</div></section>
  <footer>▣ Your privacy matters. {{SOURCE_NOTE}}</footer>
</main><script>document.querySelector('[data-print]')?.addEventListener('click',()=>window.print());document.querySelector('[data-details]')?.addEventListener('click',()=>document.querySelector('.incidents')?.scrollIntoView({behavior:'smooth'}));</script></body></html>
